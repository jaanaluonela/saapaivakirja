name: Tallenna päivittäinen sää
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hae ja tallenna sää
        run: python scripts/save_weather.py
      - name: Tallenna historiatiedosto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Päivitä automaattinen säähistoria"
            git push
          fi
